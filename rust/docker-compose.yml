# ─────────────────────────────────────────────────────────────────
# docker-compose.yml - Remote deployment for the Rust port
#
# Usage (from repo root, context includes src/tools.json):
#   docker compose -f rust/docker-compose.yml up -d
#
# Configure credentials via .env file or environment variables below.
# ─────────────────────────────────────────────────────────────────

services:
  appstore-connect-mcp-rust:
    build:
      context: ..
      dockerfile: rust/Dockerfile
    image: appstore-connect-mcp-rust:latest
    container_name: appstore-connect-mcp-rust
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Required: App Store Connect API credentials
      APP_STORE_CONNECT_ISSUER_ID: ${APP_STORE_CONNECT_ISSUER_ID}
      APP_STORE_CONNECT_KEY_ID: ${APP_STORE_CONNECT_KEY_ID}
      APP_STORE_CONNECT_PRIVATE_KEY: ${APP_STORE_CONNECT_PRIVATE_KEY}

      # Transport configuration (parity with the TypeScript compose)
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "3000"

      # Optional: verbose logging
      MCP_VERBOSE: ${MCP_VERBOSE:-0}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
