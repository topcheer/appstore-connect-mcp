[package]
name = "appstore-connect-mcp"
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
description = "App Store Connect MCP server (Rust port of @ggaiteam/appstore-connect-mcp)"
license = "MIT"
repository = "https://github.com/topcheer/appstore-connect-mcp"
homepage = "https://github.com/topcheer/appstore-connect-mcp"
readme = "README.md"
keywords = ["app-store-connect", "mcp", "apple", "model-context-protocol", "ios"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["json"] }
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = true
strip = true
