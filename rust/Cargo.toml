[package]
name = "appstore-connect-mcp"
version = "1.0.5"
edition = "2024"
description = "App Store Connect MCP server (Rust port of @ggaiteam/appstore-connect-mcp)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["json"] }
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = true
strip = true
