# ─────────────────────────────────────────────────────────────────
# crates-publish — auto-publish the Rust crate to crates.io on tag
#
# Triggered by pushing a v* tag (same tag drives npm + Docker +
# release binaries). Runs after a successful CI gate on the same
# commit to avoid publishing broken code.
#
# Setup: repo secret CARGO_REGISTRY_TOKEN = crates.io token with
# publish-new + publish-update scopes.
# ─────────────────────────────────────────────────────────────────
name: crates-publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI on this commit
        run: |
          SHA="${{ github.sha }}"
          for i in $(seq 1 40); do
            STATUS=$(gh run list --commit "$SHA" --workflow CI --json conclusion,status \
              --jq '.[0] | "\(.status)/\(.conclusion // "pending")"' 2>/dev/null || echo "unknown")
            echo "attempt $i: CI=$STATUS"
            case "$STATUS" in
              completed/success) exit 0 ;;
              completed/*) echo "CI failed - refusing to publish"; exit 1 ;;
            esac
            sleep 30
          done
          echo "CI did not settle in time - refusing to publish"; exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build deps (aws-lc-rs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake perl

      - name: Verify version matches tag
        working-directory: rust
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="appstore-connect-mcp") | .version')
          if [ "$TAG" != "$CRATE" ]; then
            echo "tag v$TAG != crate version $CRATE - refusing to publish"; exit 1
          fi
          echo "version match: $CRATE"

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
