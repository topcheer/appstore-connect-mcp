# ─────────────────────────────────────────────────────────────────
# release-binaries -- attach prebuilt Rust binaries to a tag release
#
# Triggered by pushing a v* tag (same tag that drives npm/docker).
# Produces:
#   appstore-connect-mcp-darwin-arm64.tar.gz   (Apple Silicon)
#   appstore-connect-mcp-darwin-x86_64.tar.gz  (Intel Mac)
#   appstore-connect-mcp-linux-x86_64.tar.gz   (glibc >= 2.31)
#
# Other platforms: `cargo install` from source, or the Docker image.
# ─────────────────────────────────────────────────────────────────
name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: darwin-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          ASSET=appstore-connect-mcp-${{ matrix.asset }}
          cd rust/target/${{ matrix.target }}/release
          tar czf "$ASSET.tar.gz" appstore-connect-mcp
          shasum -a 256 "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
          cp "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" "$GITHUB_WORKSPACE/"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            appstore-connect-mcp-*.tar.gz
            appstore-connect-mcp-*.sha256
          generate_release_notes: true
